<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Found IT — Community Lost &amp; Found. Post items you've found or lost in your community to help reunite belongings with their owners.">
  <title>Found IT — Community Lost &amp; Found</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      <span class="brand-icon">🧭</span> Found IT
    </a>
    <div class="ms-auto d-flex align-items-center gap-2" id="navAuth">
      <!-- JS fills: user info + logout, or sign-in button -->
      <button class="btn btn-primary btn-sm" id="openLogin">Sign In</button>
    </div>
  </div>
</nav>

<!-- ── Toast container ───────────────────────────────────────────── -->
<div class="container" id="toastContainer"></div>

<div class="container pb-4">

  <!-- ── Search bar + community filter ── -->
  <div class="row g-2 mb-3" id="searchForm">
    <div class="col-md-3">
      <select class="form-select community-select" id="communitySelect">
        <option value="">All communities</option>
        <!-- JS populates from /api/meta -->
      </select>
    </div>
    <div class="col-md-4">
      <input class="form-control" id="searchInput" placeholder="Search items…">
    </div>
    <input type="hidden" id="hiddenCat">
    <input type="hidden" id="hiddenPlace">
    <div class="col-md-2 d-grid">
      <button type="button" class="btn btn-outline-light" id="filtersBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-funnel me-1" viewBox="0 0 16 16">
          <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .389.812l-4.64 5.76v4.928a.5.5 0 0 1-.724.447l-2.5-1.25A.5.5 0 0 1 6.25 11.5V7.572L1.611 1.812A.5.5 0 0 1 1.5 1.5z"/>
        </svg>
        Filters
      </button>
    </div>
    <div class="col-md-3 d-grid">
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>
  </div>

  <!-- ── Filters modal ── -->
  <div class="modal fade" id="filtersModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Filters</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="filterCategory">
              <option value="">All categories</option>
            </select>
          </div>
          <hr>
          <div class="mb-2">
            <label class="form-label">Location</label>
            <select class="form-select" id="filterPlace">
              <option value="">Any location</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="filtersClear">Clear</button>
          <button type="button" class="btn btn-primary" id="filtersApply">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Tab pills ── -->
  <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="got-tab" data-bs-toggle="pill" data-bs-target="#got" type="button" role="tab">
        Found Items
        <span class="badge bg-light text-dark ms-1 d-none" id="foundBadge"></span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="lost-tab" data-bs-toggle="pill" data-bs-target="#lost" type="button" role="tab">
        Lost Items
        <span class="badge bg-light text-dark ms-1 d-none" id="lostBadge"></span>
      </button>
    </li>
  </ul>

  <!-- ── Tab content ── -->
  <div class="tab-content" id="pills-tabContent">

    <!-- Found tab -->
    <div class="tab-pane fade show active" id="got" role="tabpanel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="section-title mb-0">Items people have found</h4>
        <button class="btn btn-success" onclick="openPostModal('found')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg me-1" viewBox="0 0 16 16">
            <path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
          </svg>
          I Found Something
        </button>
      </div>
      <div id="foundCards"></div>
    </div>

    <!-- Lost tab -->
    <div class="tab-pane fade" id="lost" role="tabpanel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="section-title mb-0">Items people have lost</h4>
        <button class="btn btn-danger" onclick="openPostModal('lost')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg me-1" viewBox="0 0 16 16">
            <path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
          </svg>
          I Lost Something
        </button>
      </div>
      <div id="lostCards"></div>
    </div>
  </div>

</div>

<!-- ── Post creation modal ── -->
<div class="modal fade" id="postModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="postModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="postForm">
        <div class="modal-body">
          <input type="hidden" name="kind" id="postKind">

          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Item name</label>
              <input class="form-control" name="item_name" id="postItemName" placeholder="e.g. Black wallet, iPhone 15" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Community</label>
              <select class="form-select" name="community" id="postCommunity" required>
                <!-- JS populates from /api/meta -->
              </select>
            </div>
          </div>

          <div class="row g-2 mt-1">
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" name="category" id="postCategory" required>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <select class="form-select" name="place" id="postPlace" required>
              </select>
            </div>
          </div>

          <div class="mt-2">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" id="postDescription" rows="2" placeholder="Color, brand, distinguishing marks…"></textarea>
          </div>

          <div class="row g-2 mt-1">
            <div class="col-md-6">
              <label class="form-label">Your Name</label>
              <input class="form-control" name="name" id="postName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone (optional)</label>
              <input class="form-control" name="phone" id="postPhone" type="tel">
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label">Images (up to 3)</label>
            <input type="file" class="form-control" name="images" id="imageInput" multiple accept="image/*">
            <div id="imagePreview" class="row g-2 mt-2"></div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" id="postSubmitBtn">
            <span class="btn-text">Post</span>
            <span class="spinner-border spinner-border-sm d-none" role="status" id="postSpinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ── Lightbox modal ── -->
<div class="modal fade" id="lightboxModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0 shadow-none">
      <div class="modal-body p-0 text-center">
        <img id="lightboxImg" class="img-fluid rounded-3" src="" alt="Full-size image"
             style="max-height:85vh; cursor:zoom-out;"
             onclick="bootstrap.Modal.getInstance(document.getElementById('lightboxModal')).hide()">
      </div>
    </div>
  </div>
</div>

<!-- ── Auth modal ── -->
<div class="modal fade" id="authModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Welcome to Found IT</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <!-- Microsoft OAuth (future) -->
        <button type="button" class="btn-microsoft" disabled title="Coming soon">
          <svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
          Continue with Microsoft
        </button>
        <p class="text-center mt-2 mb-0" style="font-size:.75rem; color:var(--muted);">Institutional SSO — coming soon</p>

        <div class="auth-divider">dev login</div>

        <!-- Dev login tabs -->
        <ul class="nav nav-tabs" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab" type="button">Login</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab" type="button">Register</button>
          </li>
        </ul>

        <div class="tab-content pt-3">
          <div class="tab-pane fade show active" id="loginTab">
            <form id="loginForm">
              <div class="mb-2">
                <label class="form-label">Email</label>
                <input class="form-control" name="email" type="email" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
              </div>
              <button class="btn btn-primary w-100">Login</button>
            </form>
          </div>

          <div class="tab-pane fade" id="registerTab">
            <form id="registerForm">
              <div class="row g-2">
                <div class="col-12 col-sm-6">
                  <label class="form-label">Full Name</label>
                  <input class="form-control" name="name" required>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label">Email</label>
                  <input class="form-control" name="email" type="email" required>
                </div>
              </div>
              <div class="row g-2 mt-1">
                <div class="col-12 col-sm-6">
                  <label class="form-label">Phone (optional)</label>
                  <input class="form-control" name="phone" type="tel">
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" name="password" required>
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-3">Create Account</button>
            </form>
          </div>
        </div>

        <div class="text-danger small pt-2 d-none" id="authError"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Application JS -->
<script src="js/app.js"></script>

</body>
</html>
